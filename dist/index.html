<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d16" />
  <meta name="description" content="输入月薪和工作时间，实时查看下班倒计时与每秒收入。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090d16'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23d8ff4f' stroke-width='3'/%3E%3Cpath d='M16 9v7l5 3' fill='none' stroke='%23d8ff4f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>薪跳 · 工资计时器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d16;
      --panel: #111724;
      --panel-2: #171e2d;
      --line: #2b3445;
      --text: #f5f7fb;
      --muted: #8d98aa;
      --acid: #d8ff4f;
      --blue: #64b5ff;
      --danger: #ff8b8b;
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 82% 8%, rgba(100,181,255,.12), transparent 30%),
        radial-gradient(circle at 12% 90%, rgba(216,255,79,.08), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.02em; }
    .mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--acid); color: #0b100e; font-size: 1.05rem; }
    .date { color: var(--muted); font-size: .875rem; }
    main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, .9fr); gap: 18px; align-items: stretch; }
    .card { background: linear-gradient(145deg, rgba(23,30,45,.92), rgba(14,19,30,.96)); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 24px 70px rgba(0,0,0,.22); }
    .live { min-height: 560px; padding: clamp(26px, 5vw, 58px); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .live::after { content: "¥"; position: absolute; right: -20px; bottom: -95px; color: rgba(216,255,79,.035); font-size: 28rem; font-weight: 900; line-height: 1; pointer-events: none; }
    .mascot-wrap { position: absolute; right: 2%; top: 15px; width: min(33%, 220px); z-index: 2; animation: mascot-run 1.2s ease-in-out infinite; transform-origin: 50% 100%; }
    .mascot { display: block; width: 100%; filter: drop-shadow(0 18px 24px rgba(0,0,0,.34)); }
    .mascot-say { position: absolute; right: 70%; top: 20%; white-space: nowrap; color: #0b100e; background: var(--acid); padding: 7px 10px; border-radius: 10px 10px 2px 10px; font-weight: 800; font-size: .75rem; transform: rotate(-3deg); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    .coin { position: absolute; color: var(--acid); font-weight: 900; font-size: .85rem; opacity: 0; animation: coin-pop 2.4s ease-out infinite; }
    .coin.c1 { left: 24%; top: 22%; }
    .coin.c2 { right: 10%; top: 42%; animation-delay: .8s; }
    .coin.c3 { left: 34%; bottom: 15%; animation-delay: 1.6s; }
    .mascot-wrap.celebrate { animation: mascot-party .55s ease-in-out infinite alternate; }
    @keyframes mascot-run { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
    @keyframes mascot-party { from { transform: translateY(0) rotate(-4deg) scale(1); } to { transform: translateY(-10px) rotate(4deg) scale(1.04); } }
    @keyframes coin-pop { 0% { transform: translateY(8px) scale(.7); opacity: 0; } 28% { opacity: .9; } 100% { transform: translateY(-30px) scale(1.15); opacity: 0; } }
    .status { display: inline-flex; align-items: center; gap: 9px; width: fit-content; color: var(--acid); font-size: .875rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 rgba(216,255,79,.45); animation: pulse 1.7s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(216,255,79,0); } }
    .eyebrow { color: var(--muted); margin: 72px 0 8px; font-size: .95rem; }
    .countdown { margin: 0; font-variant-numeric: tabular-nums; font-size: clamp(3.5rem, 9vw, 7.4rem); line-height: .95; letter-spacing: -.075em; font-weight: 820; position: relative; z-index: 1; }
    .countdown span { color: var(--muted); font-size: .2em; letter-spacing: 0; margin-left: .28em; font-weight: 650; }
    .earned-wrap { margin-top: auto; position: relative; z-index: 1; }
    .earned-label { color: var(--muted); margin-bottom: 7px; }
    .earned { color: var(--acid); font-size: clamp(2.1rem, 5vw, 4rem); font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; animation: money-glow 2.2s ease-in-out infinite; }
    @keyframes money-glow { 50% { text-shadow: 0 0 22px rgba(216,255,79,.2); } }
    .per-second { color: var(--muted); margin-top: 6px; font-size: .9rem; }
    .progress-track { height: 5px; margin-top: 18px; max-width: 430px; overflow: hidden; background: rgba(255,255,255,.08); border-radius: 999px; }
    .progress-bar { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--acid), #7cffc9); transition: width .6s ease; box-shadow: 0 0 16px rgba(216,255,79,.35); }
    .settings { padding: 25px; display: flex; flex-direction: column; }
    .settings-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
    h2 { margin: 0; font-size: 1.12rem; }
    .saved { font-size: .78rem; color: var(--muted); opacity: 0; transition: opacity .2s; }
    .saved.show { opacity: 1; }
    .field { margin-bottom: 17px; }
    label { display: block; color: #c4cbd6; font-size: .875rem; margin-bottom: 8px; }
    input {
      width: 100%; border: 1px solid var(--line); background: #0d1320; color: var(--text);
      border-radius: 13px; padding: 13px 14px; outline: none; min-height: 48px;
    }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(100,181,255,.12); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .salary-box { position: relative; }
    .salary-box::before { content: "¥"; position: absolute; left: 14px; top: 13px; color: var(--muted); z-index: 1; }
    .salary-box input { padding-left: 32px; }
    .rates { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 13px; }
    .rate { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: .86rem; }
    .rate strong { color: var(--text); font-size: 1rem; font-variant-numeric: tabular-nums; }
    .tip { grid-column: 1 / -1; padding: 15px 18px; border-radius: 15px; background: rgba(100,181,255,.08); border: 1px solid rgba(100,181,255,.18); color: #b9d9f5; font-size: .86rem; line-height: 1.55; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 560px); padding-top: 18px; }
      main { grid-template-columns: 1fr; }
      .live { min-height: 440px; padding: 28px 24px; }
      .eyebrow { margin-top: 56px; }
      .countdown { font-size: clamp(3.3rem, 17vw, 5.2rem); }
      .mascot-wrap { width: 155px; right: -8px; top: 30px; opacity: .88; }
      .mascot-say { right: 62%; top: 8%; font-size: .7rem; }
      .settings { min-height: 470px; }
      .date { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .pulse, .mascot-wrap, .coin, .earned { animation: none; } .progress-bar { transition: none; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="mark">¥</span><span>薪跳</span></div>
      <div class="date" id="dateText"></div>
    </header>
    <main>
      <section class="card live" aria-live="polite">
        <div class="status"><span class="pulse"></span><span id="statusText">工作进行中</span></div>
        <div class="mascot-wrap" id="mascotWrap" aria-hidden="true">
          <span class="mascot-say" id="mascotSay">冲鸭！</span>
          <span class="coin c1">+¥</span><span class="coin c2">+¥</span><span class="coin c3">+¥</span>
          <img class="mascot" src="salary-mascot.png" alt="" />
        </div>
        <div class="eyebrow" id="countdownLabel">距离下班还有</div>
        <p class="countdown" id="countdown">00:00:00</p>
        <div class="earned-wrap">
          <div class="earned-label" id="earnedLabel">今天已经赚到</div>
          <div class="earned" id="earned">¥0.00</div>
          <div class="per-second" id="perSecondText">每一秒都算数</div>
          <div class="progress-track" title="今日工作进度"><div class="progress-bar" id="progressBar"></div></div>
        </div>
      </section>

      <aside class="card settings" aria-label="工资设置">
        <div class="settings-head"><h2>你的工作设置</h2><span class="saved" id="saved">已保存</span></div>
        <div class="field">
          <label for="salary">税前月薪</label>
          <div class="salary-box"><input id="salary" type="number" min="0" step="100" inputmode="decimal" value="12000" /></div>
        </div>
        <div class="two">
          <div class="field"><label for="start">上班时间</label><input id="start" type="time" value="09:00" /></div>
          <div class="field"><label for="end">下班时间</label><input id="end" type="time" value="18:00" /></div>
        </div>
        <div class="two">
          <div class="field"><label for="days">每月工作天数</label><input id="days" type="number" min="1" max="31" step="0.25" value="21.75" /></div>
          <div class="field"><label for="breakMinutes">每日休息（分钟）</label><input id="breakMinutes" type="number" min="0" step="5" value="60" /></div>
        </div>
        <div class="rates">
          <div class="rate"><span>每小时</span><strong id="hourRate">¥0.00</strong></div>
          <div class="rate"><span>每分钟</span><strong id="minuteRate">¥0.00</strong></div>
          <div class="rate"><span>每秒</span><strong id="secondRate">¥0.0000</strong></div>
          <div class="rate"><span>今日目标</span><strong id="dayRate">¥0.00</strong></div>
        </div>
      </aside>
      <div class="tip">按月薪 ÷ 每月工作天数 ÷ 每日有效工时估算。休息时间会从工作时长中扣除，结果仅供日常参考。</div>
    </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const fields = ['salary', 'start', 'end', 'days', 'breakMinutes'];
    const defaults = { salary: 12000, start: '09:00', end: '18:00', days: 21.75, breakMinutes: 60 };
    const currency = new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY', minimumFractionDigits: 2 });

    function readSettings() {
      return {
        salary: Math.max(0, Number($('salary').value) || 0),
        start: $('start').value || defaults.start,
        end: $('end').value || defaults.end,
        days: Math.max(1, Number($('days').value) || defaults.days),
        breakMinutes: Math.max(0, Number($('breakMinutes').value) || 0)
      };
    }

    function timeOn(date, value) {
      const [h, m] = value.split(':').map(Number);
      const result = new Date(date);
      result.setHours(h, m, 0, 0);
      return result;
    }

    function formatDuration(ms) {
      const seconds = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const m = String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function calculate(settings, now = new Date()) {
      let start = timeOn(now, settings.start);
      let end = timeOn(now, settings.end);
      if (end <= start) end.setDate(end.getDate() + 1);
      if (now.getHours() < 6 && end.getDate() !== start.getDate()) start.setDate(start.getDate() - 1);

      const totalSeconds = Math.max(60, (end - start) / 1000 - settings.breakMinutes * 60);
      const dayRate = settings.salary / settings.days;
      const secondRate = dayRate / totalSeconds;
      let state = 'working';
      let remaining = end - now;
      let elapsedSeconds = Math.max(0, (now - start) / 1000);

      if (now < start) { state = 'before'; remaining = start - now; elapsedSeconds = 0; }
      if (now >= end) { state = 'after'; remaining = 0; elapsedSeconds = totalSeconds; }
      const shiftSeconds = Math.max(60, (end - start) / 1000);
      const progress = Math.min(1, Math.max(0, elapsedSeconds / shiftSeconds));
      return { state, remaining, earned: dayRate * progress, progress, dayRate, secondRate, totalSeconds };
    }

    function render() {
      const settings = readSettings();
      const now = new Date();
      const result = calculate(settings, now);
      $('dateText').textContent = new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' }).format(now);
      $('dayRate').textContent = currency.format(result.dayRate);
      $('hourRate').textContent = currency.format(result.secondRate * 3600);
      $('minuteRate').textContent = currency.format(result.secondRate * 60);
      $('secondRate').textContent = `¥${result.secondRate.toFixed(4)}`;
      $('earned').textContent = currency.format(result.earned);
      $('perSecondText').textContent = `此刻每秒入账 ¥${result.secondRate.toFixed(4)}`;
      $('progressBar').style.width = `${result.progress * 100}%`;
      $('mascotWrap').classList.toggle('celebrate', result.state === 'after');

      if (result.state === 'before') {
        $('statusText').textContent = '等待上班';
        $('countdownLabel').textContent = '距离上班还有';
        $('countdown').textContent = formatDuration(result.remaining);
        $('earnedLabel').textContent = '今天已经赚到';
        $('mascotSay').textContent = '准备开工';
      } else if (result.state === 'after') {
        $('statusText').textContent = '今日已收工';
        $('countdownLabel').textContent = '今天辛苦了';
        $('countdown').innerHTML = '已下班<span>✓</span>';
        $('earnedLabel').textContent = '今日收入估算';
        $('mascotSay').textContent = '下班咯！';
      } else {
        $('statusText').textContent = '工作进行中';
        $('countdownLabel').textContent = '距离下班还有';
        $('countdown').textContent = formatDuration(result.remaining);
        $('earnedLabel').textContent = '今天已经赚到';
        $('mascotSay').textContent = result.progress > .85 ? '马上收工！' : '每秒都算！';
      }
    }

    function applySettings(next) {
      for (const key of fields) if (next[key] !== undefined) $(key).value = String(next[key]);
      localStorage.setItem('salaryTickerSettings', JSON.stringify(readSettings()));
      render();
      return { settings: readSettings(), message: '设置已更新' };
    }

    try {
      const stored = JSON.parse(localStorage.getItem('salaryTickerSettings'));
      if (stored) for (const key of fields) if (stored[key] !== undefined) $(key).value = stored[key];
    } catch (_) {}

    let savedTimer;
    fields.forEach((id) => $(id).addEventListener('input', () => {
      localStorage.setItem('salaryTickerSettings', JSON.stringify(readSettings()));
      $('saved').classList.add('show');
      clearTimeout(savedTimer);
      savedTimer = setTimeout(() => $('saved').classList.remove('show'), 1300);
      render();
    }));

    const context = document.modelContext;
    if (context?.registerTool) {
      const lifecycle = new AbortController();
      try {
        Promise.resolve(context.registerTool({
          name: 'configure_salary_timer',
          title: '设置工资计时器',
          description: '设置月薪、上下班时间、每月工作天数和每日休息分钟数，并更新页面上的实时收入。',
          inputSchema: {
            type: 'object',
            properties: {
              salary: { type: 'number', minimum: 0 },
              start: { type: 'string', pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' },
              end: { type: 'string', pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' },
              days: { type: 'number', minimum: 1, maximum: 31 },
              breakMinutes: { type: 'number', minimum: 0, maximum: 1440 }
            },
            additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute(input) {
            if (!input || typeof input !== 'object') throw new Error('请输入有效的设置');
            if (input.salary !== undefined && (!Number.isFinite(input.salary) || input.salary < 0)) throw new Error('月薪不能小于 0');
            if (input.days !== undefined && (!Number.isFinite(input.days) || input.days < 1 || input.days > 31)) throw new Error('每月工作天数应在 1 到 31 之间');
            if (input.breakMinutes !== undefined && (!Number.isFinite(input.breakMinutes) || input.breakMinutes < 0 || input.breakMinutes > 1440)) throw new Error('休息时间应在 0 到 1440 分钟之间');
            if (input.start !== undefined && !/^([01]\d|2[0-3]):[0-5]\d$/.test(input.start)) throw new Error('上班时间格式应为 HH:mm');
            if (input.end !== undefined && !/^([01]\d|2[0-3]):[0-5]\d$/.test(input.end)) throw new Error('下班时间格式应为 HH:mm');
            return applySettings(input);
          }
        }, { signal: lifecycle.signal })).catch(() => {});
      } catch (_) {}
    }

    render();
    setInterval(render, 250);
  </script>
</body>
</html>
